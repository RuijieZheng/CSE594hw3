services:
  - type: web
    name: cse594hw3
    env: python
    rootDir: a3_submission
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TRIALS_PER_PARTICIPANT
        value: "6"
