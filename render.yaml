services:
  - type: web
    name: cse594-a3-study
    env: python
    disks:
      - name: study-data
        mountPath: /var/data
        sizeGB: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TRIALS_PER_PARTICIPANT
        value: "6"
      - key: RUNTIME_DATA_DIR
        value: /var/data
